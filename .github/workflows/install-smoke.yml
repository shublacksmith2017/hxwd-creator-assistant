name: Windows core install smoke
on: workflow_dispatch
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install FFmpeg
        shell: powershell
        run: choco install ffmpeg -y --no-progress
      - name: Real core install and model checks (Ego onboarding excluded)
        shell: powershell
        env:
          HXWD_ACTIVATION: ${{ secrets.HXWD_ACTIVATION }}
        run: |
          $activationObject = $env:HXWD_ACTIVATION | ConvertFrom-Json
          Write-Output ("::add-mask::" + $activationObject.apiKey)
          $env:Path += ';C:\ProgramData\chocolatey\bin'
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/activation.json",$env:HXWD_ACTIVATION)
          Remove-Item Env:HXWD_ACTIVATION
          python distribution/configure.py . "$env:RUNNER_TEMP/activation.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:EASEL_BROWSER_PROVIDER = 'egolite'
          & powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1 -OpenClaw -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv/Scripts/python.exe distribution/verify_runtime.py --model-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .venv/Scripts/python.exe -m easel ping
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'Core only: EgoLite GUI onboarding and platform actions are NOT validated by CI.' 
      - name: Gateway health summary
        if: always()
        shell: powershell
        run: |
          Get-Process node -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,CPU
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -eq 37289 } | Select-Object LocalAddress,LocalPort
      - name: Remove temporary activation
        if: always()
        shell: powershell
        run: Remove-Item "$env:RUNNER_TEMP/activation.json" -ErrorAction SilentlyContinue
